name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goarch }}
    runs-on: macos-14
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/handbyte .

      - name: Package
        run: |
          cd dist
          ARCHIVE="handbyte_${GITHUB_REF_NAME}_darwin_${{ matrix.goarch }}.tar.gz"
          tar -czf "${ARCHIVE}" handbyte
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goarch }}
          path: dist/handbyte_*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          ls -la
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
