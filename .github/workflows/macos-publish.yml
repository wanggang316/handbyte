# After a Handbyte app release (tag app/vX.Y.Z) is published: copy its
# appcast.xml to docs/ on main, which GitHub Pages serves as the Sparkle feed
# and the landing page reads for the download button, then update the
# Homebrew cask in wanggang316/homebrew-tap.
#
# Runs on `release: published`, not on the tag push, so the Sparkle feed and
# the cask only ever point at assets that are public. CLI releases (v*) and
# prereleases are skipped.
#
# Optional repository secret:
#   HOMEBREW_TAP_TOKEN  Fine-grained PAT with Contents: read and write on
#                       wanggang316/homebrew-tap. Without it the cask step is skipped.
name: macos-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published app release to publish again (app/vX.Y.Z)'
        required: true

permissions:
  contents: write

concurrency:
  group: macos-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^app/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::tag '$TAG' is not an app release; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$INPUT_TAG" && "$IS_PRERELEASE" == "true" ]]; then
            echo "::notice::prerelease; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "tag=$TAG"
            echo "version=${TAG#app/v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.meta.outputs.skip != 'true'
        with:
          ref: main

      - name: Download release assets
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets" \
            --pattern appcast.xml --pattern "Handbyte-$VERSION.dmg" --pattern "Handbyte-$VERSION.dmg.sha256"
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 -c "Handbyte-$VERSION.dmg.sha256"
          grep -q "releases/download/$TAG/Handbyte-$VERSION.dmg" appcast.xml \
            || { echo "::error::appcast.xml does not point at this release"; exit 1; }

      - name: Publish appcast to GitHub Pages
        if: steps.meta.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/assets/appcast.xml" docs/appcast.xml
          if git diff --quiet -- docs/appcast.xml; then
            echo "::notice::docs/appcast.xml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Publish the appcast for Handbyte $VERSION"
          git push origin HEAD:main

      - name: Update Homebrew cask
        if: steps.meta.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; cask not updated"
            exit 0
          fi
          SHA256="$(awk '{print $1}' "$RUNNER_TEMP/assets/Handbyte-$VERSION.dmg.sha256")"
          macos/scripts/render-cask.sh "$VERSION" "$SHA256" "$RUNNER_TEMP/handbyte.rb"
          TAP_DIR="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/wanggang316/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          cp "$RUNNER_TEMP/handbyte.rb" "$TAP_DIR/Casks/handbyte.rb"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/handbyte.rb
          if git diff --cached --quiet; then
            echo "::notice::cask already at $VERSION"
            exit 0
          fi
          git commit -m "handbyte $VERSION"
          git push origin HEAD
